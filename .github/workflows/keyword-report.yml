name: 네이버 키워드 검색량 기록

on:
  schedule:
    - cron: "30 22 * * *"   # 매일 한국시간 07:30
  workflow_dispatch:         # 수동 실행 버튼

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 키워드 검색량 조회
        env:
          SA_CUSTOMER_ID: ${{ secrets.SA_CUSTOMER_ID }}
          SA_ACCESS_LICENSE: ${{ secrets.SA_ACCESS_LICENSE }}
          SA_SECRET_KEY: ${{ secrets.SA_SECRET_KEY }}
        run: python tools/keyword_report.py
      - name: 결과 저장
        run: |
          git config user.name "keyword-bot"
          git config user.email "keyword-bot@users.noreply.github.com"
          git add data/keywords
          git diff --cached --quiet || git commit -m "키워드 검색량 기록 $(date -u +%F)"
          git push
