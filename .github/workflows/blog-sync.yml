name: 블로그 글 홈페이지 반영

on:
  schedule:
    - cron: "0 22 * * *"   # 한국시간 07:00
    - cron: "0 10 * * *"   # 한국시간 19:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-push
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 네이버 블로그 RSS 읽기
        run: python tools/blog_sync.py
      - name: 변경이 있으면 저장
        run: |
          git config user.name "blog-sync-bot"
          git config user.email "blog-sync-bot@users.noreply.github.com"
          git add index.html sitemap.xml
          git diff --cached --quiet || { git commit -m "블로그 최신 글 반영 $(date -u +%F)"; git pull --rebase origin main; git push; }
